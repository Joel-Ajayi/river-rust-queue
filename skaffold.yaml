apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: river-rust-queue
build:
  local:
    push: false
    concurrency: 1
    useBuildkit: true
  artifacts:
    - image: rrq/core-api-go
      context: services/go-services
      docker:
        dockerfile: Dockerfile
        buildArgs:
          SERVICE: core-api
    - image: rrq/outbox-relay-go
      context: services/go-services
      docker:
        dockerfile: Dockerfile
        buildArgs:
          SERVICE: outbox-relay
    - image: rrq/ledger-worker-go
      context: services/go-services
      docker:
        dockerfile: Dockerfile
        buildArgs:
          SERVICE: ledger-worker
    - image: rrq/webhook-worker-go
      context: services/go-services
      docker:
        dockerfile: Dockerfile
        buildArgs:
          SERVICE: webhook-worker
    - image: rrq/fraud-worker-go
      context: services/go-services
      docker:
        dockerfile: Dockerfile
        buildArgs:
          SERVICE: fraud-worker
    - image: rrq/webhook-echo-go
      context: services/go-services
      docker:
        dockerfile: Dockerfile
        buildArgs:
          SERVICE: webhook-echo
    - image: rrq/migrate
      context: deploy/db/migrations
      docker:
        dockerfile: Dockerfile
    - image: rrq/seed-performance
      context: deploy/db/seed
      docker:
        dockerfile: Dockerfile
