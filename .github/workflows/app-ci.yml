name: Application CI

on:
  push:
    branches: [main]
    paths:
      - "services/go-services/**"
      - "api/proto/**"
      - "deploy/db/**"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "services/go-services/**"
      - "api/proto/**"
      - "deploy/db/**"
      - ".github/**"

permissions:
  contents: read
  packages: write

jobs:
  # 1. FAST FEEDBACK (Runs on all PRs and Main)
  go:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/go-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/go-services/go.sum
      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        working-directory: api/proto
        run: buf generate .
      - name: Unit tests
        run: make test-unit

  integration-test:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/go-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/go-services/go.sum
      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        working-directory: api/proto
        run: buf generate .
      - name: Integration tests
        run: make test-integration

  buf:
    name: Protobuf Lint & Breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        run: buf lint api/proto
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking api/proto --against '.git#branch=main,subdir=api/proto'

  # 2. RELEASE & PROMOTE (Runs ONLY on Main after tests pass)
  images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    # Wait for ALL tests to pass before spending time building Docker images
    needs: [go, integration-test, buf]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        working-directory: api/proto
        run: buf generate .

      - name: Set lowercase registry
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and Push with Bake
        uses: docker/bake-action@v6
        env:
          TAG: ${{ github.sha }}
        with:
          push: true

  gitops-promote:
    name: Promote to GitOps
    runs-on: ubuntu-latest
    # Wait for the images to successfully publish before updating the GitOps repo
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: Joel-Ajayi/rrq-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: rrq-gitops

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update Image Tags
        run: |
          export TAG="${{ github.sha }}"
          cd rrq-gitops/overlays/prod/workloads
          yq -i '.images[].newTag = strenv(TAG)' kustomization.yaml
          cd ../datastores
          yq -i '.images[].newTag = strenv(TAG)' kustomization.yaml

      - name: Commit and Push
        working-directory: rrq-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Update RRQ images to ${{ github.sha }}"
          git push origin main
